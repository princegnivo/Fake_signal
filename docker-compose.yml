version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading-signal-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SIGNAL_INTERVAL=${SIGNAL_INTERVAL:-120}
      - ENTRY_DELAY=${ENTRY_DELAY:-3}
      - MARTINGALE_INTERVAL=${MARTINGALE_INTERVAL:-1}
      - EXPIRATION_TIME=${EXPIRATION_TIME:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
